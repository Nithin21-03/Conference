<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sign In | ICBDTT-2026 Sapthagiri NPS University</title>
  
  <link rel="icon" type="image/webp" href="{{ url_for('static', filename='images/favicon.webp') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      background: linear-gradient(135deg, #001040 0%, #000c30 60%, #0a1b4d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: var(--radius-xl);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      border: 1px solid rgba(198, 158, 102, 0.4);
    }
    .login-header {
      background: #001040;
      color: #ffffff;
      padding: 36px 32px 30px;
      text-align: center;
      border-bottom: 3px solid var(--accent-gold);
    }
    .login-body {
      padding: 36px 32px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <img src="{{ url_for('static', filename='images/snpsu_logo.webp') }}" alt="SNPSU" style="height:48px; margin:0 auto 14px; filter:brightness(0) invert(1);">
      <h3 style="color:#ffffff; font-size:1.35rem; margin-bottom:4px;">Organizers Portal</h3>
      <span style="color:var(--accent-gold); font-size:0.8rem; text-transform:uppercase; letter-spacing:0.08em; font-weight:700;">ICBDTT-2026 Admin Sign In</span>
    </div>

    <div class="login-body">
      
      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}" style="font-size:0.85rem; padding:10px 14px; margin-bottom:20px;">
              <span>{{ message }}</span>
              <button class="alert-close">&times;</button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('admin.login') }}" method="POST">
        <div class="form-group" style="margin-bottom:20px;">
          <label class="form-label" for="username">Username</label>
          <div style="position:relative;">
            <input type="text" id="username" name="username" class="form-input" placeholder="admin" required autofocus style="padding-left:38px;">
            <i class="bi bi-person-fill" style="position:absolute; left:12px; top:12px; color:var(--text-muted);"></i>
          </div>
        </div>

        <div class="form-group" style="margin-bottom:28px;">
          <label class="form-label" for="password">Password</label>
          <div style="position:relative;">
            <input type="password" id="password" name="password" class="form-input" placeholder="••••••••••••" required style="padding-left:38px;">
            <i class="bi bi-lock-fill" style="position:absolute; left:12px; top:12px; color:var(--text-muted);"></i>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">
          <i class="bi bi-box-arrow-in-right"></i> Sign In to Console
        </button>

        <div style="margin-top:24px; text-align:center;">
          <a href="{{ url_for('main.index') }}" style="font-size:0.88rem; color:var(--primary-navy); font-weight:600;">
            &larr; Return to Public Website
          </a>
        </div>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
